name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin:
    name: plugin self-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: verify-plugin
        run: node scripts/verify-plugin.mjs

  corpus:
    name: skill corpus and patch layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install test deps
        run: python3 -m pip install --upgrade pytest pyyaml
      - name: pytest
        run: python3 -m pytest -q
